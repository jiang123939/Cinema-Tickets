<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Cinema.Tickets</title>
    <link rel="stylesheet" href="cinema-kit/kit/tokens.css">
    <link rel="stylesheet" href="cinema-kit/kit/base.css">
    <link rel="stylesheet" href="cinema-kit/kit/layout.css">
    <link rel="stylesheet" href="cinema-kit/kit/components.css">
</head>
<body>
    <div class="l-page">
        <header class="l-header">
            <div class="l-container c-header">
                <a class="c-header__logo" href=" ">
                    <svg class="c-icon c-icon--lg" aria-hidden="true"><use href="cinema-kit/kit/icons.svg#icon-logo"></use></svg>
                    <span>Cinema.Tickets</span>
                </a >
                <nav class="c-nav" aria-label="Main">
                    <a class="c-nav__link" href="index.html">Movies</a >
                    <a class="c-nav__link" href="bookings.html">Bookings</a >
                    <a class="c-nav__link" href="cart.html">Cart <span class="c-counter" hidden="hidden" id="header-cart-counter">0</span></a >
                </nav>
                <div class="c-header__user">
                    <a class="c-btn c-btn--secondary c-btn--sm" href="login.html">Log in</a >
                    <a class="c-btn c-btn--primary c-btn--sm" href="registration.html">Register</a >
                </div>
            </div>
        </header>

        <main class="l-main">
            <div class="l-container l-stack l-stack--lg">
                <div class="l-narrow">
                    <section class="c-card">
                        <div class="c-card__header"><h1 class="c-card__title">Create an account</h1></div>
                        <form class="c-card__body" id="registration-form" novalidate>
                            <div id="error-container"></div>

                            <div class="c-field">
                                <label class="c-field__label" for="reg-name">Full name</label>
                                <input class="c-input" id="reg-name" type="text" required>
                            </div>
                            <div class="c-field">
                                <label class="c-field__label" for="reg-email">Email</label>
                                <input class="c-input" id="reg-email" type="email" required>
                            </div>
                            <div class="c-field">
                                <label class="c-field__label" for="reg-password">Password</label>
                                <input class="c-input" id="reg-password" type="password" required>
                                <p class="c-field__hint">6 to 64 characters, at least one letter and one digit.</p >
                            </div>
                            <div class="c-field">
                                <label class="c-field__label" for="reg-birth">Date of birth</label>
                                <input class="c-input" id="reg-birth" type="date" required>
                            </div>
                            <fieldset class="c-field">
                                <legend class="c-field__label">Gender</legend>
                                <div class="c-field__row">
                                    <label class="c-radio">
                                        <input class="c-radio__input" type="radio" name="gender" value="Male" required>
                                        <span class="c-radio__box"></span><span>Male</span>
                                    </label>
                                    <label class="c-radio">
                                        <input class="c-radio__input" type="radio" name="gender" value="Female">
                                        <span class="c-radio__box"></span><span>Female</span>
                                    </label>
                                </div>
                            </fieldset>
                            <div class="c-field">
                                <label class="c-field__label" for="reg-phone">Phone number</label>
                                <input class="c-input" id="reg-phone" type="tel" placeholder="+7 (___) ___-__-__" required>
                            </div>
                            <button class="c-btn c-btn--primary c-btn--block" type="submit">Register</button>
                        </form>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/registration.js"></script>
</body>
</html>
