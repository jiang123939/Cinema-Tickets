<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Cinema.Tickets</title>
    <link rel="stylesheet" href="cinema-kit/kit/tokens.css">
    <link rel="stylesheet" href="cinema-kit/kit/base.css">
    <link rel="stylesheet" href="cinema-kit/kit/layout.css">
    <link rel="stylesheet" href="cinema-kit/kit/components.css">
</head>
<body>
    <div class="l-page">
        <header class="l-header">
            <div class="l-container c-header">
                <a class="c-header__logo" href=" ">
                    <svg class="c-icon c-icon--lg" aria-hidden="true"><use href="cinema-kit/kit/icons.svg#icon-logo"></use></svg>
                    <span>Cinema.Tickets</span>
                </a >
                <nav class="c-nav" aria-label="Main">
                    <a class="c-nav__link" href="index.html">Movies</a >
                    <a class="c-nav__link" href="bookings.html">Bookings</a >
                    <a class="c-nav__link" href="cart.html" aria-current="page">Cart <span class="c-counter" hidden="hidden" id="header-cart-counter">0</span></a >
                </nav>
                <div class="c-header__user">
                    <div id="auth-guest" style="display: flex; gap: 12px;">
                        <a class="c-btn c-btn--secondary c-btn--sm" href="login.html">Log in</a >
                        <a class="c-btn c-btn--primary c-btn--sm" href="registration.html">Register</a >
                    </div>
                    <div id="auth-user" style="display: none; align-items: center; gap: 12px;">
                        <a class="c-header__email" href="profile.html">
                            <svg class="c-icon c-icon--sm" aria-hidden="true"><use href="cinema-kit/kit/icons.svg#icon-user"></use></svg>
                            <span id="header-email">Loading...</span>
                        </a >
                        <button class="c-btn c-btn--ghost c-btn--sm" type="button" id="logout-btn">Log out</button>
                    </div>
                </div>
            </div>
        </header>

        <main class="l-main">
            <div class="l-container l-stack l-stack--lg">
                <div class="c-page-title">
                    <div class="c-page-title__main">
                        <h1>Cart</h1>
                        <div class="c-page-title__subtitle" id="cart-total-count">Loading...</div>
                    </div>
                </div>
                <div id="cart-alerts"></div>
                <div id="cart-content"></div>
            </div>
        </main>
    </div>

    <script src="js/demo-mode.js"></script>
    <script type="module" src="js/common.js"></script>
    <script type="module" src="js/cart.js"></script>
</body>
</html>
